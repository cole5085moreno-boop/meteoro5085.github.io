<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Redirigiendo a Estación Meteorológica Colegio 5085...</title>
    <script>
      // Detecta si es un sitio de usuario (usuario.github.io) o de proyecto (usuario.github.io/repo)
      var pathSegmentsToKeep = window.location.hostname.endsWith('github.io') && window.location.pathname.split('/')[1] ? 1 : 0;
      var l = window.location;
      var repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      l.replace(repoBase + '/');
    </script>
  </head>
  <body>
    Redirigiendo...
  </body>
</html>
