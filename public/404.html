<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Redirigiendo a Estación Meteorológica Colegio 5085...</title>
    <script>
      // Redirige rutas profundas en GitHub Pages hacia la raíz para que el SPA enrute correctamente
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirigiendo...
  </body>
</html>
